<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="739" viewBox="0 0 1200 739"><rect width="1200" height="739" fill="#F4EFE6" rx="24"/><line x1="120" y1="75" x2="120" y2="595" stroke="#16130E" stroke-width="4"/><circle cx="120" cy="115" r="14" fill="#E8622D"/><text x="180" y="109" font-family="Helvetica,Arial,sans-serif" font-size="60" font-weight="700" fill="#16130E">Jun 1</text><text x="180" y="167" font-family="Helvetica,Arial,sans-serif" font-size="46" fill="#6E675C">Copilot switches to</text><text x="180" y="223" font-family="Helvetica,Arial,sans-serif" font-size="46" fill="#6E675C">usage-based billing</text><circle cx="120" cy="335" r="14" fill="#E8622D"/><text x="180" y="329" font-family="Helvetica,Arial,sans-serif" font-size="60" font-weight="700" fill="#16130E">Jun 8</text><text x="180" y="387" font-family="Helvetica,Arial,sans-serif" font-size="46" fill="#6E675C">Apple introduces Siri AI</text><text x="180" y="443" font-family="Helvetica,Arial,sans-serif" font-size="46" fill="#6E675C">at WWDC</text><circle cx="120" cy="555" r="14" fill="#E8622D"/><text x="180" y="549" font-family="Helvetica,Arial,sans-serif" font-size="60" font-weight="700" fill="#16130E">Jun 12-30</text><text x="180" y="607" font-family="Helvetica,Arial,sans-serif" font-size="46" fill="#6E675C">Export controls imposed,</text><text x="180" y="663" font-family="Helvetica,Arial,sans-serif" font-size="46" fill="#6E675C">then lifted; rollout follows</text></svg>